# 自动部署到阿里云 ECS（SCP 直传模式，不依赖镜像仓库）：
#   质量门禁（lint + test + build）→ 构建镜像 → docker save 打包
#   → scp 直传服务器 → docker load → compose 重启
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置（仅 3 个）：
#   ECS_HOST        服务器公网 IP / 域名
#   ECS_USER        SSH 用户（如 root）
#   ECS_SSH_KEY     SSH 私钥（建议专用部署密钥对）
#
# 服务器一次性准备（见 README「生产部署」节）：
#   安装 Docker + compose 插件；/opt/skillhive/.env 按 .env.example 配好；
#   安全组放行 Console（8080）与 MCP（3100）端口

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: 构建镜像并部署
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: |
          docker build -f deploy/Dockerfile.server -t skillhive-server:0.1.0 .
          docker build -f deploy/Dockerfile.console -t skillhive-console:0.1.0 .

      - name: 打包镜像
        run: |
          docker save skillhive-server:0.1.0 skillhive-console:0.1.0 | gzip > images.tar.gz
          ls -lh images.tar.gz

      - name: 下发镜像包与 compose 文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "images.tar.gz,docker-compose.prod.yml"
          target: /opt/skillhive/
          strip_components: 0

      - name: 服务器导入镜像并滚动重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/skillhive
            docker load < images.tar.gz
            rm -f images.tar.gz
            # 固定项目名：复用既有容器命名与 postgres 数据卷（skillhive_pgdata）
            export COMPOSE_PROJECT_NAME=skillhive
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
