# 自动部署到阿里云 ECS（SCP 直传模式，不依赖镜像仓库）：
#   完整质量门禁 → 构建带 commit 标签的镜像 → docker save 打包
#   → scp 直传服务器 → 生产配置门禁 → compose 健康切换；失败自动回到原镜像
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置（仅 3 个）：
#   ECS_HOST        服务器公网 IP / 域名
#   ECS_USER        SSH 用户（如 root）
#   ECS_SSH_KEY     SSH 私钥（建议专用部署密钥对）
#
# 服务器一次性准备（见 README「生产部署」节）：
#   安装 Docker + compose 插件；/opt/skillhive/.env 按 .env.example 配好；
#   原始端口保持回环绑定，由受信 TLS 反向代理提供 Console 与 /mcp

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: 生产依赖安全审计
        run: pnpm audit --prod --audit-level high

  deploy:
    name: 构建镜像并部署
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: |
          docker build -f deploy/Dockerfile.server -t skillhive-server:${{ github.sha }} .
          docker build -f deploy/Dockerfile.console -t skillhive-console:${{ github.sha }} .

      - name: 打包镜像
        run: |
          docker save skillhive-server:${{ github.sha }} skillhive-console:${{ github.sha }} | gzip > images.tar.gz
          ls -lh images.tar.gz

      - name: 下发镜像包与 compose 文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "images.tar.gz,docker-compose.prod.yml,scripts/deploy/remote-deploy.sh"
          target: /opt/skillhive/
          strip_components: 0

      - name: 服务器导入镜像并滚动重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd /opt/skillhive
            SKILLHIVE_DEPLOY_SHA=${{ github.sha }} sh scripts/deploy/remote-deploy.sh
