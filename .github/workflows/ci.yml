name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 质量与安全校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 完整质量门禁
        run: pnpm check

      - name: 生产依赖安全审计
        run: pnpm audit --prod --audit-level high

      - name: Compose 配置校验
        env:
          POSTGRES_PASSWORD: ci-only-password
          SKILLHIVE_SESSION_SECRET: ci-session-secret-at-least-32-characters
          SKILLHIVE_INTERNAL_TOKEN: ci-internal-token-at-least-32-characters
        run: |
          touch .env
          docker compose -f docker-compose.prod.yml config --quiet
